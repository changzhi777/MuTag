# MuTag .cn 直连入口（2026-11-17：由 301 跳转改为直接反代——用户裁决不经 .com）
# 与线上 /etc/nginx/sites-enabled/mutag-cn.conf 一致（certbot 托管证书自动续期）
server {
	server_name mutag.qingmulife.cn;
	location / {
		proxy_pass http://127.0.0.1:18000;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
	}
	listen 443 ssl;
	ssl_certificate /etc/letsencrypt/live/mutag.qingmulife.cn/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/mutag.qingmulife.cn/privkey.pem;
	include /etc/letsencrypt/options-ssl-nginx.conf;
	ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
server {
	listen 80;
	server_name mutag.qingmulife.cn;
	return 301 https://$host$request_uri;
}
