# MuTag 广州 106 生产入口（2026-11-17 上线：DNS 权威已切 106，为当前活码主入口）
# 线上路径 /etc/nginx/sites-enabled/mutag.conf（certbot 托管证书自动续期，与本文件一致）
# 拓扑：DNS mutag.qingmulife.cn A → 106.53.168.73（DNSPod 批量导入/修改通道下发）
server {
    server_name mutag.qingmulife.cn;
    location / {
        proxy_pass http://127.0.0.1:18000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/mutag.qingmulife.cn/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/mutag.qingmulife.cn/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = mutag.qingmulife.cn) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name mutag.qingmulife.cn;
    return 404; # managed by Certbot
}
